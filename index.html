<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What's for Lunch – Blake Upper School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ---------- Palette tokens (signage keeps the same colors in either theme) ---------- */
:root {
  --blue: #00549f;
  --brown: #60351d;
  --green: #007d57;
  --white: #ffffff;
  --blue-deep: #003f78;
  --blue-soft: rgba(255,255,255,0.72);
  --ink: #1d2a36;
  --rule: #d8e2ec;
  --panel: #ffffff;
  --display: "Bricolage Grotesque", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Atkinson Hyperlegible", "Helvetica Neue", Arial, sans-serif;
  --u: min(1vw, 1.778vh); /* one design unit; keeps 16:9 proportions on any screen */
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --panel: #ffffff; --ink: #1d2a36; --rule: #d8e2ec; }
}
:root[data-theme="dark"] { --panel: #ffffff; --ink: #1d2a36; --rule: #d8e2ec; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; height: 100%; overflow: hidden;
  background: var(--blue); color: var(--white);
  font-family: var(--body);
  -webkit-font-smoothing: antialiased;
}

/* ---------- Layout ---------- */
.board {
  height: 100%;
  display: grid;
  grid-template-columns: 1.55fr 1fr;
  grid-template-rows: auto 1fr;
}

/* Notice strip for conference / no-school days */
.notice {
  grid-column: 1 / -1;
  background: var(--brown); color: var(--white);
  font-family: var(--display); font-weight: 600;
  font-size: calc(var(--u) * 2.1);
  padding: calc(var(--u) * 1.1) calc(var(--u) * 4);
}
.notice[hidden] { display: none; }
.hero, .side { grid-row: 2; }

/* Left: the headline dish */
.hero {
  position: relative;
  padding: calc(var(--u) * 4) calc(var(--u) * 4) calc(var(--u) * 3.5);
  display: flex; flex-direction: column;
  min-height: 0;
}
.when { display: flex; align-items: baseline; gap: calc(var(--u) * 1.6); flex-wrap: wrap; }
.when .label {
  font-family: var(--display); font-weight: 800;
  font-size: calc(var(--u) * 3.4); letter-spacing: -0.01em;
}
.when .date { font-size: calc(var(--u) * 2.2); color: var(--blue-soft); }

.feature {
  margin-top: calc(var(--u) * 3);
  font-family: var(--display); font-weight: 600;
  font-size: calc(var(--u) * 2.4); color: var(--blue-soft);
}
.feature:empty { display: none; }

.headline-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; }
.headline {
  margin: 0;
  font-family: var(--display); font-weight: 800;
  line-height: 0.95; letter-spacing: -0.025em;
  font-size: calc(var(--u) * 9);
  text-wrap: balance;
}
.subtitle {
  margin-top: calc(var(--u) * 1.2);
  font-size: calc(var(--u) * 2.4); color: var(--blue-soft);
}
.subtitle:empty { display: none; }

.alts { list-style: none; margin: calc(var(--u) * 3) 0 0; padding: 0; display: grid; gap: calc(var(--u) * 1.3); }
.alts li {
  display: flex; align-items: center; gap: calc(var(--u) * 1.4);
  font-family: var(--display); font-weight: 600;
  font-size: calc(var(--u) * 3.6); line-height: 1.05;
}

/* Vegetarian marker: a green leaf-shaped badge */
.veg {
  flex: none;
  display: inline-grid; place-items: center;
  width: 1.15em; height: 1.15em;
  border-radius: 0.15em 0.75em 0.15em 0.75em;
  background: var(--green); color: var(--white);
  font-family: var(--body); font-weight: 700;
  font-size: 0.62em; line-height: 1;
}
.hero .veg { box-shadow: 0 0 0 0.12em var(--white); }

.legend {
  margin-top: calc(var(--u) * 3);
  display: flex; align-items: center; gap: calc(var(--u) * 0.9);
  font-size: calc(var(--u) * 1.5); color: var(--blue-soft);
}
.legend .veg { font-size: calc(var(--u) * 1.4); box-shadow: none; }

/* Right: the rest of the line */
.side {
  background: var(--panel); color: var(--ink);
  display: grid; grid-template-rows: 1fr auto;
  min-height: 0;
}
.lines { padding: calc(var(--u) * 4) calc(var(--u) * 3.5) calc(var(--u) * 2); overflow: hidden; }
.group + .group { margin-top: calc(var(--u) * 2.6); padding-top: calc(var(--u) * 2.2); border-top: 2px solid var(--rule); }
.group h2 {
  margin: 0 0 calc(var(--u) * 0.9);
  font-family: var(--display); font-weight: 600;
  font-size: calc(var(--u) * 1.7); color: var(--blue);
}
.group ul { list-style: none; margin: 0; padding: 0; display: grid; gap: calc(var(--u) * 0.55); }
.group li {
  display: flex; align-items: center; gap: calc(var(--u) * 0.9);
  font-size: calc(var(--u) * 2.35); line-height: 1.15; font-weight: 700;
}
.group li .veg { font-size: calc(var(--u) * 2.1); }
.pizza { color: var(--brown); }

.bowl {
  font-family: var(--display); font-weight: 800;
  font-size: calc(var(--u) * 3.1); line-height: 1; color: var(--green);
  letter-spacing: -0.01em;
}
.bowl small { display: block; margin-top: calc(var(--u) * 0.5); font-family: var(--body); font-weight: 400; font-size: calc(var(--u) * 1.6); color: var(--ink); letter-spacing: 0; }

.dessert {
  background: var(--brown); color: var(--white);
  padding: calc(var(--u) * 2.2) calc(var(--u) * 3.5);
  display: flex; align-items: baseline; justify-content: space-between; gap: calc(var(--u) * 2);
}
.dessert span { font-family: var(--display); font-weight: 600; font-size: calc(var(--u) * 1.8); opacity: 0.8; }
.dessert strong { font-family: var(--display); font-weight: 800; font-size: calc(var(--u) * 3.2); line-height: 1; text-align: right; }

/* Empty state (no menu loaded for the coming days) */
.empty { grid-column: 1 / -1; display: grid; place-content: center; text-align: center; padding: calc(var(--u) * 6); }
.empty h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: calc(var(--u) * 7); letter-spacing: -0.02em; }
.empty p { margin: calc(var(--u) * 2) 0 0; font-size: calc(var(--u) * 2.4); color: var(--blue-soft); }

/* Portrait screens: stack the panels */
@media (orientation: portrait) {
  :root { --u: min(1.6vw, 1vh); }
  .board { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; }
  .side { grid-row: 3; }
}

@media (prefers-reduced-motion: no-preference) {
  .hero > * { animation: rise 700ms cubic-bezier(.2,.7,.2,1) both; }
  .hero > *:nth-child(2) { animation-delay: 80ms; }
  .hero > *:nth-child(3) { animation-delay: 160ms; }
  @keyframes rise { from { opacity: 0; transform: translateY(0.6em); } }
}
</style>
</head>
<body>
<main class="board" id="board" aria-live="polite"></main>

<script>
/* =====================================================================
   MENU DATA — this is the only part that changes each month.
   Prefix an item with "V " to mark it vegetarian.
   Use "Name|description" to add a smaller line under a headline dish.
   Non-lunch days use { closed: "Reason" }.
   ===================================================================== */
const MENU = {
  "2026-10-01": { entrees: ["Meat Lasagna", "V Cheese Lasagna"], sides: ["Roasted Cauliflower"], pizza: true, bowl: "Burrito", dessert: "Devil's Food Cake" },
  "2026-10-02": { entrees: ["General Tso's Chicken", "V General Tso's Tofu"], sides: ["Brown Rice", "Steamed Vegetables", "Vegetarian Egg Rolls"], bowl: "Bulgogi", dessert: "Fortune Cookie" },
  "2026-10-05": { entrees: ["Creamy Poblano Chicken", "V Creamy Poblano Tofu"], sides: ["Jasmine Rice", "Corn", "Garlic Bread"], bowl: "Moroccan", dessert: "Frozen Treat" },
  "2026-10-06": { entrees: ["Blackened Fish", "V Blackened Tofu"], sides: ["Creamy Polenta", "Sautéed Spinach"], pizza: true, bowl: "Brunch", dessert: "Lemon Curd" },
  "2026-10-07": { entrees: ["Korean Pork BBQ Taco", "V Korean BBQ Vegan Taco"], sides: ["Tortillas", "Korean Slaw"], also: ["Chicken Bacon Ranch Melt"], bowl: "Niçoise", dessert: "Homemade Brownie" },
  "2026-10-08": { entrees: ["Oven Roasted Turkey", "V Vegan Meatballs"], sides: ["V Mashed Potatoes", "V Vegetarian Gravy", "Green Beans"], pizza: true, bowl: "Pesto", dessert: "Rice Krispie Treat" },
  "2026-10-09": { entrees: ["Smoked Chicken", "V Tomato & Corn Pasta"], sides: ["Ratatouille", "Garlic Bread"], bowl: "Creole", dessert: "S'more Bars" },
  "2026-10-12": { entrees: ["Doro Wat|Ethiopian chicken stew", "V Lentil Dahl"], sides: ["Rice", "Spiced Carrots"], also: ["Falafel Flatbread"], bowl: "Miso", dessert: "Frozen Treats" },
  "2026-10-13": { entrees: ["Beef Tacos", "V Braised Beans"], sides: ["Lettuce & Pico de Gallo", "Shredded Cheese & Crema"], pizza: true, bowl: "Mexican Mole", dessert: "Churro" },
  "2026-10-14": { closed: "Conferences" },
  "2026-10-15": { closed: "Conferences" },
  "2026-10-16": { closed: "No school" },
  "2026-10-19": { entrees: ["Chicken Cacciatore", "V Chickpea Cacciatore"], sides: ["Rosemary Potatoes", "Roasted Mushrooms", "Breadsticks"], bowl: "Curry", dessert: "Chef's Choice Dessert" },
  "2026-10-20": { entrees: ["Smoked Pork Loin", "V Picadillo"], sides: ["Rice", "Green Beans"], pizza: true, bowl: "Tinga", dessert: "Fruit Crisp" },
  "2026-10-21": { entrees: ["Spanish Pot Roast", "V Spanish Tempeh"], sides: ["Papas Bravas", "Roasted Vegetables"], also: ["Chicken Tacos"], bowl: "Plant Based", dessert: "Brownie" },
  "2026-10-22": { entrees: ["V Creamy Vegetable Pasta", "Roasted Chicken"], sides: ["Roasted Parmesan Tomatoes"], pizza: true, bowl: "Kung Pao", dessert: "Frozen Treat" },
  "2026-10-23": { entrees: ["Lemon Pepper Chicken", "V Lemon Pepper Tofu"], sides: ["Herbed Quinoa", "Broccolini"], also: ["Mini Corn Dogs"], bowl: "Chicken Caesar", dessert: "Cookie" },
  "2026-10-26": { entrees: ["BBQ Chicken", "V BBQ Tofu"], sides: ["Parsley Potatoes", "Sweet Corn", "Cheesy Bread"], bowl: "Jerk", dessert: "Chocolate Pudding" },
  "2026-10-27": { entrees: ["Santa Fe Chicken", "V Black Beans & Corn"], sides: ["Cilantro Lime Quinoa", "Chipotle Cream Sauce"], pizza: true, bowl: "Thai Lettuce Wrap", dessert: "Vanilla Cake" },
  "2026-10-28": { entrees: ["V Pesto & Tomato Pasta"], sides: ["Roasted Green Beans"], also: ["Cuban Slider"], bowl: "Vindaloo", dessert: "Fruit Crisp" },
  "2026-10-29": { entrees: ["Beef Bulgogi", "V Tempeh Bulgogi"], sides: ["Jasmine Rice", "Sugar Snap Peas"], pizza: true, bowl: "BBQ", dessert: "Italian Ice" },
  "2026-10-30": { feature: "Pasta Bar", entrees: ["Ragù", "V Marinara", "V Alfredo"], sides: ["Chef's Choice Vegetables", "Garlic Bread"], bowl: "Greek Salad", dessert: "Sweet Treats" }
};

/* =====================================================================
   SETTINGS
   ===================================================================== */
const TIME_ZONE = "America/Chicago";   // school's clock, regardless of player settings
const SWITCH_TO_NEXT_AT = "13:30";      // after this time, show the next school day's lunch
const NEXT_MONTH_NAME = "November";     // used when the loaded menu runs out

/* =====================================================================
   Date helpers (all dates handled as YYYY-MM-DD strings in school time)
   ===================================================================== */
function schoolNow() {
  // Preview any moment with ?date=2026-10-12 and/or ?time=14:00
  const params = new URLSearchParams(location.search);
  const parts = Object.fromEntries(
    new Intl.DateTimeFormat("en-CA", { timeZone: TIME_ZONE, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" })
      .formatToParts(new Date()).map(p => [p.type, p.value])
  );
  return {
    date: params.get("date") || `${parts.year}-${parts.month}-${parts.day}`,
    time: params.get("time") || `${parts.hour}:${parts.minute}`
  };
}
const toUTC = s => { const [y, m, d] = s.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d)); };
const fmt = (s, opts) => toUTC(s).toLocaleDateString("en-US", { timeZone: "UTC", ...opts });
const dayDiff = (a, b) => Math.round((toUTC(b) - toUTC(a)) / 86400000);

function nextLunchAfter(dateStr, inclusive) {
  return Object.keys(MENU).sort().find(k => (inclusive ? k >= dateStr : k > dateStr) && !MENU[k].closed);
}

function labelFor(target, today) {
  const diff = dayDiff(today, target);
  if (diff === 0) return "Today's lunch";
  if (diff === 1) return "Tomorrow's lunch";
  if (diff < 7)  return `${fmt(target, { weekday: "long" })}'s lunch`;
  return "Next lunch";
}

/* =====================================================================
   Rendering
   ===================================================================== */
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function item(raw) {
  const veg = raw.startsWith("V ");
  const [name, desc] = (veg ? raw.slice(2) : raw).split("|");
  return { veg, name, desc: desc || "" };
}
const vegBadge = '<span class="veg" aria-label="Vegetarian">V</span>';

function render() {
  const now = schoolNow();
  const board = document.getElementById("board");
  const todayEntry = MENU[now.date];

  // Which day should the screen show?
  const afterLunch = now.time >= SWITCH_TO_NEXT_AT;
  const target = (todayEntry && !todayEntry.closed && !afterLunch)
    ? now.date
    : nextLunchAfter(now.date, false);

  const notice = todayEntry && todayEntry.closed
    ? `${todayEntry.closed} today. No lunch service.`
    : "";

  if (!target) {
    board.innerHTML = `
      <section class="empty">
        <h1>${esc(NEXT_MONTH_NAME)} menu coming soon</h1>
        <p>Check the Taher Food4Life app or blakeschool.org for the latest menu.</p>
      </section>`;
    return;
  }

  const m = MENU[target];
  const entrees = m.entrees.map(item);
  // A "feature" (like Pasta Bar) becomes the headline, with every entrée listed beneath it
  const [lead, ...alts] = m.feature ? [{ veg: false, name: m.feature, desc: "" }, ...entrees] : entrees;
  const extras = [...(m.pizza ? ["__pizza"] : []), ...(m.also || [])];

  board.innerHTML = `
    <div class="notice" ${notice ? "" : "hidden"}>${esc(notice)}</div>

    <section class="hero">
      <div class="when">
        <span class="label">${esc(labelFor(target, now.date))}</span>
        <span class="date">${esc(fmt(target, { weekday: "long", month: "long", day: "numeric" }))}</span>
      </div>
      <div class="headline-wrap">
        <h1 class="headline" id="headline">${lead.veg ? vegBadge + " " : ""}${esc(lead.name)}</h1>
        <div class="subtitle">${esc(lead.desc)}</div>
        <ul class="alts">
          ${alts.map(a => `<li>${a.veg ? vegBadge : ""}<span>${esc(a.name)}</span></li>`).join("")}
        </ul>
      </div>
      <div class="legend">${vegBadge}<span>Vegetarian</span></div>
    </section>

    <aside class="side">
      <div class="lines">
        ${m.sides && m.sides.length ? `
        <div class="group">
          <h2>On the side</h2>
          <ul>${m.sides.map(item).map(s => `<li>${s.veg ? vegBadge : ""}<span>${esc(s.name)}</span></li>`).join("")}</ul>
        </div>` : ""}
        ${extras.length ? `
        <div class="group">
          <h2>Also serving</h2>
          <ul>${extras.map(x => x === "__pizza"
              ? `<li class="pizza">Pizza Day</li>`
              : `<li>${esc(x)}</li>`).join("")}</ul>
        </div>` : ""}
        ${m.bowl ? `
        <div class="group">
          <h2>Power bowl</h2>
          <div class="bowl">${esc(m.bowl)}</div>
        </div>` : ""}
      </div>
      ${m.dessert ? `<div class="dessert"><span>Dessert</span><strong>${esc(m.dessert)}</strong></div>` : ""}
    </aside>`;

  fitHeadline();
}

/* Shrink the headline dish until it fits in at most three lines */
function fitHeadline() {
  const h = document.getElementById("headline");
  if (!h) return;
  const unit = Math.min(innerWidth / 100, innerHeight * 1.778 / 100);
  let size = unit * 9;
  h.style.fontSize = size + "px";
  const maxH = () => size * 0.95 * 3 + 2;
  while (h.scrollHeight > maxH() && size > unit * 3.5) {
    size -= unit * 0.25;
    h.style.fontSize = size + "px";
  }
}

render();
setInterval(render, 60 * 1000);          // re-check the clock every minute
addEventListener("resize", fitHeadline);

/* Reload once overnight so a republished menu is picked up even if the player never restarts */
setInterval(() => {
  if (schoolNow().time === "03:00" && navigator.onLine) location.reload();
}, 60 * 1000);
</script>
</body>
</html>
